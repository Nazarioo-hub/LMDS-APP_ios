# Codemagic — LMDS App para SideStore
# Documentação: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
#   ios-sidestore  → IPA sem assinatura; o SideStore assina-o com o teu Apple ID ao instalar
#   android-apk    → APK de release para instalar à mão
#
# Nada aqui precisa de conta Apple Developer nem de certificados.

definitions:
  pub_get: &pub_get
    name: Dependências Flutter
    script: flutter pub get

  testes: &testes
    name: Análise e testes
    script: |
      flutter analyze
      flutter test

workflows:
  ios-sidestore:
    name: iOS para SideStore
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - *pub_get
      - *testes
      - name: CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Build release sem assinatura
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Empacotar IPA para o SideStore
        script: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          SAIDA=build/ios/sidestore
          VERSAO=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")

          # O SideStore volta a assinar tudo; restos de assinatura só atrapalham.
          find "$APP" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$APP" -name "embedded.mobileprovision" -delete

          rm -rf "$SAIDA" && mkdir -p "$SAIDA/Payload"
          cp -R "$APP" "$SAIDA/Payload/"
          cd "$SAIDA"
          zip -qry "LMDS-$VERSAO-$BUILD_NUMBER.ipa" Payload
          rm -rf Payload
      - name: Verificar IPA
        script: |
          set -e
          IPA=$(ls build/ios/sidestore/*.ipa)
          unzip -l "$IPA" | grep -q "Payload/Runner.app/Runner$"
          unzip -p "$IPA" Payload/Runner.app/Runner > /tmp/Runner
          lipo -info /tmp/Runner
          echo "OK: $IPA ($(du -h "$IPA" | cut -f1))"
    artifacts:
      - build/ios/sidestore/*.ipa

  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.41.7
      java: 17
    scripts:
      - *pub_get
      - *testes
      - name: Build APK
        script: flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
