# Codemagic — LMDS App
# Documentação: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Sem assinatura nenhuma:
#   ios-sem-assinatura  → IPA sem assinatura, para instalar com Sideloadly/AltStore
#   android-apk         → APK de release para instalar à mão

definitions:
  ambiente: &ambiente
    flutter: 3.41.7
    xcode: latest
    cocoapods: default

  pub_get: &pub_get
    name: Dependências Flutter
    script: flutter pub get

  testes: &testes
    name: Análise e testes
    script: |
      flutter analyze
      flutter test

  pods: &pods
    name: CocoaPods
    script: |
      cd ios
      pod install --repo-update

workflows:
  ios-sem-assinatura:
    name: iOS (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *ambiente
    scripts:
      - *pub_get
      - *testes
      - *pods
      - name: Build sem assinatura
        script: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Empacotar como IPA
        script: |
          mkdir -p build/ios/sideload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/sideload/Payload/
          cd build/ios/sideload
          zip -qr LMDS-sem-assinatura.ipa Payload
    artifacts:
      - build/ios/sideload/*.ipa

  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.41.7
      java: 17
    scripts:
      - *pub_get
      - *testes
      - name: Build APK
        script: flutter build apk --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
