name: Compilar

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.7

jobs:
  ios:
    name: iOS (sem assinatura)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build sem assinatura
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Empacotar como IPA
        run: |
          mkdir -p build/ios/sideload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/sideload/Payload/
          cd build/ios/sideload
          zip -qr LMDS-sem-assinatura.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LMDS-iOS-sem-assinatura
          path: build/ios/sideload/LMDS-sem-assinatura.ipa

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências Flutter
        run: flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: LMDS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
